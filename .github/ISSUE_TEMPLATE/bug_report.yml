name: 缺陷反馈 / Bug report
description: 提供可复现步骤，帮助定位界面、交互或统计问题。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。此表单会公开发布，请删除个人信息、账号密码、Cookie、数据库导出和私有资料。安全漏洞请先阅读 [SECURITY.md](https://github.com/liao69040-collab/hengzhen-grid-atlas/blob/main/SECURITY.md)，不要在这里公开可利用细节。
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: Git Tag 或提交；如果是自行改动的版本，请说明。
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 运行方式 / Environment
      options:
        - 本地合成演示 / Local synthetic demo
        - 自行部署 / Self-hosted
        - 在线产品 / Hosted product
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与浏览器 / Device and browser
      placeholder: macOS / Chrome；或 iPhone / Safari，注明版本和是否微信内打开
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 写出入口、所选地区/批次、操作顺序。可以使用虚构学校或合成演示复现。
      placeholder: |
        1. 打开……
        2. 选择……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果 / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual behavior
      description: 可附已脱敏截图或最小错误日志；不要附整个浏览器会话或数据库。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容确认
      options:
        - label: 我已移除个人信息、凭据和未获授权公开的资料。
          required: true
